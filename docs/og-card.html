<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Literata:opsz,wght@7..72,400;7..72,700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#F6F1E3;font-family:Literata,serif;color:#262115}
.rule{position:absolute;top:0;bottom:0;left:90px;width:3px;background:rgba(191,58,32,.32)}
.in{position:absolute;inset:0;padding:80px 90px 70px 140px;display:flex;flex-direction:column;justify-content:center}
.kick{font:600 20px "IBM Plex Mono",monospace;letter-spacing:.22em;color:#756B54}
.kick b{color:#BF3A20}
h1{font-size:150px;font-weight:700;line-height:1.18;letter-spacing:-.015em;margin:64px 0 16px}
.crossed{position:relative;display:inline-block;color:#8d8570}
.crossed i{position:absolute;left:-3%;right:-3%;top:52%;height:10px;background:#BF3A20;border-radius:4px;transform:rotate(-2.5deg)}
.crossed u{position:absolute;left:50%;top:-.58em;transform:translateX(-50%) rotate(-5deg);font:400 72px "Patrick Hand",cursive;color:#BF3A20;text-decoration:none}
.sub{font-size:30px;color:#4d4636}
mark{background:linear-gradient(100deg,rgba(200,255,0,0) 1%,rgba(200,255,0,.85) 4%,rgba(200,255,0,.6) 96%,rgba(200,255,0,0) 99%);padding:2px 10px;border-radius:6px 12px 8px 10px}
.sig{position:absolute;right:80px;bottom:52px;font:400 40px "Patrick Hand",cursive;transform:rotate(-2deg)}
</style></head><body>
<div class="rule"></div>
<div class="in">
  <p class="kick">GIA SƯ TIẾNG ANH GIAO TIẾP · <b>ĐÀ NẴNG &amp; ONLINE</b></p>
  <h1>Học để <span class="crossed">thi<i></i><u>nói</u></span>.</h1>
  <p class="sub">1 kèm 1 &amp; nhóm nhỏ — buổi đầu <mark>miễn phí</mark>, việc của bạn là mở miệng.</p>
</div>
<p class="sig">Thanh Hiếu</p>
</body></html>
